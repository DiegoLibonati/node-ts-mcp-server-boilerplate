services:
  mcp-server:
    container_name: mcp-server-dev
    build:
      context: .
      dockerfile: Dockerfile.development
    env_file:
      - .env
    environment:
      NODE_ENV: development
      MCP_TRANSPORT: http
      HTTP_HOST: 0.0.0.0
    ports:
      - "5060:5060"
    volumes:
      - ./src:/app/src
      - ./__tests__:/app/__tests__
      - /app/node_modules
    restart: unless-stopped
